name: Set up Vite+
description: Installs Node from `.nvmrc` and the dependencies, with Vite+'s cache. Run it after checkout.

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .nvmrc
        cache: true
