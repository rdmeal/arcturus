name: Quality check

on:
  workflow_call:

permissions:
  contents: read

# Each check is its own job, so they run in parallel, and `quality-gate` decides
# the result. Only the gate is required by the `main` ruleset (ADR 0045).
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - run: vp check

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The shard count is the length of this list.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - run: vp test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob

      # Uploaded even when tests fail, so the merged report shows the failures.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-report:
    name: Test report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: .vitest/blob/
          merge-multiple: true

      # Blob files are named `blob-<index>-<count>.json`, so a shard that wrote
      # no report shows up as fewer files than the count in their names.
      - name: Check every shard wrote a report
        run: |
          shopt -s nullglob
          blobs=(.vitest/blob/blob-*.json)
          if [ "${#blobs[@]}" -eq 0 ]; then
            echo "No blob reports were downloaded."
            exit 1
          fi
          name=$(basename "${blobs[0]}" .json)
          total=${name##*-}
          if [ "${#blobs[@]}" -ne "$total" ]; then
            echo "Expected $total blob reports, got ${#blobs[@]}."
            exit 1
          fi

      - run: vp test --mergeReports

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - run: vp run -r build

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - run: vp run lint:workflows

  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - run: node tools/repo-checks/src/main.ts

  quality-gate:
    name: Quality gate
    # Every other job in this workflow must be listed here, or it runs without
    # blocking anything (ADR 0045).
    needs: [check, test, test-report, build, workflow-lint, repo-checks]
    # Runs even when a needed job failed or was skipped, so that it can fail;
    # a skipped required check would otherwise count as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
