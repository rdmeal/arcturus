name: Pull request title

# Pull requests are squash-merged, so the title becomes the commit on main.
# Kept apart from the pull-request workflow because it also runs on `edited`:
# re-running or skipping the quality check on every title or description edit
# would either waste minutes or let a skipped run hide a failed one.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      # The title is passed through the environment, never interpolated into
      # the script, so a crafted title can't inject shell commands.
      - name: Check the title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | vp exec commitlint --verbose
