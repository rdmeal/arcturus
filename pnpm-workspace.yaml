# Workspace globs from ADR 0016.
packages:
  - apps/web
  - services/*
  - packages/*
  - games/*/service
  - games/*/agents
  - tools/*

# Supply-chain settings: https://pnpm.io/supply-chain-security
#
# No dependency may run a build script unless it is listed in `allowBuilds`
# by name, after review. `strictDepBuilds` (fail the install on an unlisted
# build script) and `blockExoticSubdeps` (no git or tarball sources in
# transitive dependencies) are deliberately left on, at their defaults.
minimumReleaseAge: 10080 # one week, in minutes
trustPolicy: no-downgrade

# https://pnpm.io/typescript
addMissingPeerTypes: true

# Build scripts reviewed and denied. They come with @testcontainers/postgresql
# through dockerode, and aren't needed because Testcontainers uses the local
# Docker socket: ssh2's optional native crypto and cpu-features serve only
# Docker over SSH, and protobufjs's postinstall only checks versions.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

overrides:
  # graphile-config (through graphile-worker) lists @types/node ^22 as a runtime
  # dependency, whose undici-types@6.21.0 fails the no-downgrade trust check.
  # Type definitions only, so the repository's own @types/node serves instead.
  "graphile-config>@types/node": ^26.6.6
  # @vitest/mocker's optional msw peer gives every package that depends on msw
  # its own copy of Vitest, whose `test` can't find the runner's suite. Only
  # @vitest/mocker/browser's opt-in MSW interceptor uses it; browser mode's own
  # module mocking doesn't. If a Vitest upgrade makes browser mode need it, revisit.
  "@vitest/mocker>msw:peer": "-"
